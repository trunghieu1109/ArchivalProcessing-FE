services:
  frontend:
    image: node:22-alpine
    working_dir: /app
    ports:
      - "${FE_HTTP_PORT:-5173}:5173"
    environment:
      VITE_ARCHIVAL_API_BASE_URL: ${VITE_ARCHIVAL_API_BASE_URL:-/api}
      VITE_ARCHIVAL_DIRECT_PRESIGNED_UPLOAD: ${VITE_ARCHIVAL_DIRECT_PRESIGNED_UPLOAD:-true}
      VITE_FOLDER_UPLOAD_ENABLED: ${VITE_FOLDER_UPLOAD_ENABLED:-true}
      VITE_ARCHIVAL_CHUNKED_UPLOAD_CHUNK_SIZE_MB: ${VITE_ARCHIVAL_CHUNKED_UPLOAD_CHUNK_SIZE_MB:-}
      VITE_ARCHIVAL_DEV_API_PROXY_TARGET: ${ARCHIVAL_API_PROXY_PASS:-http://api:8000}
      VITE_ARCHIVAL_DEV_HMR_CLIENT_PORT: ${FE_HTTP_PORT:-5173}
    volumes:
      - .:/app
      - frontend-node-modules:/app/node_modules
    command:
      [
        "sh",
        "-c",
        "npm install && npm run dev -- --host 0.0.0.0 --port 5173",
      ]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - archival-processing
    restart: unless-stopped

networks:
  archival-processing:
    name: ${ARCHIVAL_DOCKER_NETWORK:-archival-processing-net}
    external: true

volumes:
  frontend-node-modules:
