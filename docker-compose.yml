name: archivalprocessing-fe-proto-homo

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_ARCHIVAL_API_BASE_URL: ${VITE_ARCHIVAL_API_BASE_URL:-/api}
        VITE_ARCHIVAL_DIRECT_PRESIGNED_UPLOAD: ${VITE_ARCHIVAL_DIRECT_PRESIGNED_UPLOAD:-true}
        VITE_FOLDER_UPLOAD_ENABLED: ${VITE_FOLDER_UPLOAD_ENABLED:-true}
        VITE_ARCHIVAL_CHUNKED_UPLOAD_CHUNK_SIZE_MB: ${VITE_ARCHIVAL_CHUNKED_UPLOAD_CHUNK_SIZE_MB:-}
    image: ${FRONTEND_IMAGE:-archival-processing-frontend-proto-homo:local}
    ports:
      - "${FE_HTTP_PORT:-5173}:8080"
    environment:
      ARCHIVAL_API_PROXY_PASS: ${ARCHIVAL_API_PROXY_PASS:-http://api:8000}
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-1g}
    networks:
      - archival-processing
    restart: unless-stopped

networks:
  archival-processing:
    name: ${ARCHIVAL_DOCKER_NETWORK:-archival-processing-proto-homo-net}
    external: true
